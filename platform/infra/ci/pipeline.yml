# AI Content Fabric Platform - CI/CD Pipeline
# GitHub Actions workflow

name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd platform
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd platform
          python -m pytest tests/ -v || echo "No tests yet"

      - name: Lint check
        run: |
          pip install ruff
          ruff check platform/ || echo "Lint warnings found"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f platform/infra/Dockerfile -t ai-content-fabric:latest .
